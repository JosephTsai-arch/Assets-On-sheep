    <script>
      // AI Studio preview environment constraint: Ignore Vite HMR WebSocket errors
      (function() {
        function isViteHmrError(err) {
          if (!err) return false;
          var msg = (err.message || String(err)).toLowerCase();
          var stack = (err.stack || '').toLowerCase();
          return (
            msg.indexOf('websocket') !== -1 ||
            msg.indexOf('ws:') !== -1 ||
            msg.indexOf('vite:ws') !== -1 ||
            stack.indexOf('@vite/client') !== -1 ||
            stack.indexOf('client.mjs') !== -1 ||
            stack.indexOf('bundleddevclient') !== -1
          );
        }
        window.addEventListener('unhandledrejection', function(event) {
          if (isViteHmrError(event.reason)) {
            event.preventDefault();
            if (event.stopImmediatePropagation) event.stopImmediatePropagation();
            if (event.stopPropagation) event.stopPropagation();
          }
        }, true);
        window.addEventListener('error', function(event) {
          var fn = (event.filename || '').toLowerCase();
          if (
            fn.indexOf('@vite/client') !== -1 ||
            fn.indexOf('client.mjs') !== -1 ||
            isViteHmrError(event.error) ||
            isViteHmrError(event.message)
          ) {
            event.preventDefault();
            if (event.stopImmediatePropagation) event.stopImmediatePropagation();
            if (event.stopPropagation) event.stopPropagation();
          }
        }, true);
      })();
    </script>
